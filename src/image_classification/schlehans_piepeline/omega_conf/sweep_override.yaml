method: "grid"  # "random" "grid" oder "bayes" sind auch möglich

metric:
  goal: "maximize"
  name: "score"



parameters:
  transform_method:
    values: ["hep"] #hep, hzz, hhz, z_scale_min_max, min_max, hep_min_max, hep_min_zscale
  tansform_first: 
    value: True
  gamma1:
    values: [5]
  gamma2:
    values: [10]
  gamma3: 
    values: [5]
  hep_variance1:
    value: 20
  hep_variance2:
    value: 20

  model_architecture: 
    value: "EfficientNet" # "Swin" ("tiny", "small"), "EfficientNet" ("efficientnet-b3","efficientnet-b0"), "ResNet" ("ResNet34", "ResNet50")
  model_name: 
    value: "efficientnet-b3"
  activation_function: 
    value: "NotDefined"
  in_features: 
    value: 1536 #check documentation of model for size #1536 for b3, 1280 für b0
  img_size:
    value: 300 #check documentation of model for size 224  for most, 300 for efficient

  optimizer: 
    value: "ADAM" # "ADAM" "ADAMW" "SGD"
  scheduler: 
    value: "plateau" # "plateau" "cos" "cosWarmUp"


  learning_rate:
    value: 0.00025
    #min: 0.00001
    #max: 0.005
  learingn_rate_div:
    value: 0.1
  reg_type: 
    value: "L2" #none L1, L2 both
  l1lambda:
    values: [0.0]
    #min: 0.0001
    #max: 0.01
  weight_decay:
    values: [0.0001024]
    # distribution: "log_uniform_values"
    #min: 0.00001
    #max: 0.01
  dropout:
    values: [0.4]

  num_epochs_lastlayer:
    value: 15
  num_epochs_finetune:
    value: 25
  momentum:
    value:  0.91
  betas:
    value: [0.9, 0.999]
  eps:
    value: 0.000000001
  device:
    value: "cuda"

  enable_logging:
    value: True # enable logging to WandB
  run_on_cluster:
    value: True # change configs to run on cluster
  random_seed:
    value: 42
  num_classes:
    value: 6
  batch_size:
    value: 32






